[project]
name = "arbiter-crewai"
version = "0.1.0"
description = "CrewAI tools for Arbiter — judgment before an agent signs or pays."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "crewai>=0.80",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/arbiter-xyz/arbiter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbiter_crewai"]
